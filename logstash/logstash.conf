input {
  beats {
    port => 5044
  }
}

filter {

  # Parse Apache logs
  grok {
    match => {
      "message" => '%{IPORHOST:source.address} - - \[%{HTTPDATE:timestamp}\] "%{WORD:http.request.method} %{DATA:url.original} HTTP/%{NUMBER:http.version}" %{NUMBER:http.response.status_code} %{NUMBER:http.response.body.bytes} "%{DATA:http.request.referrer}" "%{DATA:user_agent.original}"'
    }
  }

  # SQL Injection Detection
  if [url.original] =~ /(\%27)|(\')|(\-\-)|(\%23)|(#)/ {
    mutate {
      add_field => {
        "attack_type" => "SQL Injection"
        "severity" => "High"
        "comment" => "Possible SQL Injection attack detected"
      }
    }
  }

  # XSS Detection
  if [url.original] =~ /(<script>)|(%3Cscript%3E)/ {
    mutate {
      add_field => {
        "attack_type" => "Cross Site Scripting (XSS)"
        "severity" => "High"
        "comment" => "Possible XSS attack detected"
      }
    }
  }

  # Brute Force Detection
  if [url.original] =~ /login/ {
    mutate {
      add_field => {
        "attack_type" => "Brute Force Attempt"
        "severity" => "Medium"
        "comment" => "Multiple login attempts may indicate brute force"
      }
    }
  }

  # Command Injection
  if [url.original] =~ /(cmd=)|(whoami)|(ls)/ {
    mutate {
      add_field => {
        "attack_type" => "Command Injection"
        "severity" => "Critical"
        "comment" => "Possible command injection attempt"
      }
    }
  }

}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "logs"
  }

  stdout { codec => rubydebug }
}